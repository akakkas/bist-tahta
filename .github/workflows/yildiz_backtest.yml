# .github/workflows/yildiz_backtest.yml
# Tek seferlik doğrulama — yalnızca elle ("Run workflow") çalışır, cron yok.
# Backtest'i koşar, özet raporu Telegram'a yollar, detayı artifact yapar.

name: Yildiz Backtest (tek seferlik)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install yfinance pandas numpy

      - name: Backtest çalıştır
        run: python backtest.py --universe yildiz.txt --out islemler.csv > rapor.txt

      - name: Raporu Telegram'a yolla
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_text.py rapor.txt

      - name: Çıktıları sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yildiz-backtest
          path: |
            islemler.csv
            rapor.txt
          if-no-files-found: ignore
